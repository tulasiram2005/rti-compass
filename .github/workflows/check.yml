name: Check case desk
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check docs/desk.mjs

      - run: npm ci
      - name: Exercise the desk in Chrome
        run: |
          npm start > /tmp/rti-desk.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          node qa/browser.mjs
